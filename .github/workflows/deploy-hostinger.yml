# Uploads web/ (landing page + game) to Hostinger → https://play.asaxenadev.com/
# Runs automatically on push to main (changes in web/), or manually from the Actions tab.

name: Deploy web to Hostinger

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-hostinger.yml']
  workflow_dispatch:
    inputs:
      server_dir:
        description: 'Server target folder (defaults to ./ because FTP account is restricted to public_html/play)'
        required: false
        default: './'
      protocol:
        description: 'Protocol (ftps or ftp)'
        required: false
        default: 'ftps'

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP Secrets
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "::error::Secret 'FTP_SERVER' is missing or empty! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "::error::Secret 'FTP_USERNAME' is missing or empty! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Secret 'FTP_PASSWORD' is missing or empty! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required FTP secrets are present."

      - name: Prepare FTP Credentials & Host
        id: ftp_prep
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          # Remove protocol prefix if present (ftp://, https://, etc.)
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's#^[a-zA-Z]+://##')
          # Remove port if present (e.g. :21)
          CLEAN_SERVER=$(echo "$CLEAN_SERVER" | sed -E 's#:[0-9]+$##')
          # Remove trailing slashes and whitespace
          CLEAN_SERVER=$(echo "$CLEAN_SERVER" | sed -E 's#/+$##' | xargs)
          
          # Clean username: remove accidental quotes, newlines, carriage returns and whitespace
          CLEAN_USER=$(echo "${{ secrets.FTP_USERNAME }}" | tr -d '\r\n"' | xargs)

          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"
          echo "username=$CLEAN_USER" >> "$GITHUB_OUTPUT"
          echo "Prepared server hostname (length: ${#CLEAN_SERVER} chars) and username (length: ${#CLEAN_USER} chars)"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload web/ over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_prep.outputs.server }}
          username: ${{ steps.ftp_prep.outputs.username }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol || vars.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./web/
          server-dir: ${{ inputs.server_dir || vars.FTP_SERVER_DIR || './' }}
          log-level: verbose
