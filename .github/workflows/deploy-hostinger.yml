# Uploads web/ (landing page + game) to Hostinger → https://play.asaxenadev.com/ (or asaxenadev.com/play/)
# Runs automatically on push to main (changes in web/), or manually from the Actions tab.

name: Deploy web to Hostinger

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-hostinger.yml']
  workflow_dispatch:
    inputs:
      server_dir:
        description: 'Server target folder (e.g. public_html/play/ or play/ or ./)'
        required: false
        default: 'public_html/play/'

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP Secrets
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "::error::Secret 'FTP_SERVER' is missing or empty! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "::error::Secret 'FTP_USERNAME' is missing or empty! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Secret 'FTP_PASSWORD' is missing or empty! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required FTP secrets are present."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload web/ over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./web/
          server-dir: ${{ inputs.server_dir || vars.FTP_SERVER_DIR || 'public_html/play/' }}
          log-level: verbose
