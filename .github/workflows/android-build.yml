# Builds the Android app (debug APK) on every pull request and on pushes to main
# that touch the game or the Android project, so a broken Gradle / Capacitor setup
# shows up before it reaches a phone. The APK is attached to the run as an artifact (zip).
#
# On main the APK is also put on the "apk-latest" pre-release as a plain .apk file, so it can
# be downloaded straight to a phone from one fixed link:
#   https://github.com/akshat009/neon-core-v2/releases/download/apk-latest/neon-core-debug.apk

name: Android build

on:
  pull_request:
    paths: ['android-app/**', 'web/game/**', '.github/workflows/android-build.yml']
  push:
    branches: [main]
    paths: ['android-app/**', 'web/game/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: write   # to update the apk-latest release (main only)

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor CLI 8 needs Node 22+
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the app (debug = test ads)
        run: npm run sync

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: neon-core-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK on the apk-latest release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: android-app/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp app-debug.apk neon-core-debug.apk
          NOTES="Latest debug build of main (Google test ads). Commit: ${GITHUB_SHA::7}. Install neon-core-debug.apk on the phone."
          if gh release view apk-latest -R "$REPO" > /dev/null 2>&1; then
            gh release edit apk-latest -R "$REPO" --notes "$NOTES"
          else
            gh release create apk-latest -R "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Neon Core - latest debug APK" --notes "$NOTES"
          fi
          gh release upload apk-latest neon-core-debug.apk -R "$REPO" --clobber
