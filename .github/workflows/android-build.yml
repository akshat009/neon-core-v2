# Builds the Android app (debug APK) on every pull request and on pushes to main
# that touch the game or the Android project, so a broken Gradle / Capacitor setup
# shows up before it reaches a phone. The APK is attached to the run as an artifact.

name: Android build

on:
  pull_request:
    paths: ['android-app/**', 'web/game/**', '.github/workflows/android-build.yml']
  push:
    branches: [main]
    paths: ['android-app/**', 'web/game/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the app (debug = test ads)
        run: npm run sync

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: neon-core-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
