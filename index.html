<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Core - Initializing</title>
    <!-- Redirect to web/ -->
    <meta http-equiv="refresh" content="0; url=web/">
    <link rel="canonical" href="web/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #03060d;
            color: #29f3ff;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .cyber-loader {
            text-align: center;
            padding: 30px;
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(41, 243, 255, 0.4);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(41, 243, 255, 0.2), inset 0 0 20px rgba(41, 243, 255, 0.08);
            position: relative;
        }
        .core-spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 3px solid rgba(41, 243, 255, 0.15);
            border-top-color: #29f3ff;
            border-bottom-color: #ff00ff;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 10px #29f3ff);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 6px;
            font-size: 20px;
            letter-spacing: 4px;
            color: #29f3ff;
            text-shadow: 0 0 15px #29f3ff;
        }
        p {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            color: #ff33cc;
            font-weight: 700;
        }
        a { color: inherit; text-decoration: none; }
    </style>
</head>
<body>
    <div class="cyber-loader">
        <div class="core-spinner"></div>
        <h1>INITIALIZING CORE...</h1>
        <p>[ CYBER RUNNER ]</p>
    </div>
    <script>location.replace('web/' + location.search + location.hash);</script>
</body>
</html>
